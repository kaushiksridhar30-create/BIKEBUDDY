<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Crash Buddy</title>
<style>body{font-family:system-ui;max-width:480px;margin:20px auto;padding:0 14px;background:#0f1115;color:#eee}
button{font-size:16px;padding:12px 16px;margin:4px 0;border:0;border-radius:10px;background:#4f8cff;color:#fff;width:100%}
#st{padding:14px;border-radius:12px;background:#1d2b3a;margin:10px 0;min-height:48px}.red{background:#5a1d20!important}</style>
<h2>Crash Buddy</h2>
<button id=go>1. Start monitoring (allow mic, motion, GPS)</button>
<label><input type=checkbox id=ride> Ride mode (fake 40 km/h for demo)</label>
<div id=st>Idle</div><button id=cancel style=display:none>I'm OK, cancel</button>
<button id=ask>Ask Bike Buddy (speak for 5 s)</button><button id=pre>Pre-ride check</button><button id=lowtyre>Demo: make front tyre low</button><button id=sim>Test: simulate crash (no phone drop needed)</button><button id=bike>Test: replay bike telemetry</button>
<script>
const $=i=>document.getElementById(i);let stream,speed=0,armed=false,buf=[],cool=0,cur=null,loc={};
const st=(t,r)=>{$('st').textContent=t;$('st').className=r?'red':''};
const play=b=>new Promise(r=>{const a=new Audio('data:audio/wav;base64,'+b);a.onended=r;a.play()});
const rec=ms=>new Promise(r=>{const c=[],m=new MediaRecorder(stream);m.ondataavailable=e=>c.push(e.data);m.onstop=()=>r(new Blob(c));m.start();setTimeout(()=>m.stop(),ms)});
const post=(u,b)=>fetch(u,{method:'POST',body:b}).then(r=>r.json());
const form=(id,blob)=>{const f=new FormData();f.append('id',id);f.append('audio',blob,'a.webm');return f};
$('go').onclick=async()=>{stream=await navigator.mediaDevices.getUserMedia({audio:true});
 if(DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission();
 navigator.geolocation.watchPosition(p=>{speed=(p.coords.speed||0)*3.6;loc={lat:p.coords.latitude,lon:p.coords.longitude}},()=>{},{enableHighAccuracy:true});
 st('Monitoring. Drop the phone onto a cushion.')};
addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity;if(!a||!stream)return;
 const m=Math.hypot(a.x,a.y,a.z),t=Date.now();
 if(!armed&&m>25&&t>cool){armed=true;buf=[];window.peak=m/9.81;setTimeout(check,2500)}
 if(armed){buf.push(m);window.peak=Math.max(window.peak,m/9.81)}});
function check(){armed=false;const mean=buf.reduce((a,b)=>a+b,0)/buf.length;
 const sd=Math.sqrt(buf.reduce((a,b)=>a+(b-mean)**2,0)/buf.length);   // still phone => low std-dev
 if(sd<1.2){cool=Date.now()+30000;fire({speed_kmh:$('ride').checked?40:speed,peak_g:window.peak,...loc})}}
async function fire(e){e.source=e.source||'phone';const o=await post2('/api/event',e);if(o.mode==='none')return;
 cur=o.id;st('Checking on you... ('+o.mode+')',o.mode==='crash');$('cancel').style.display='block';
 await play(o.audio);st('Listening... say haan / madad');const a=await post('/api/answer',form(o.id,await rec(6000)));
 st('You said: '+(a.text||'(nothing)')+' -> '+a.status,a.status==='escalated');await play(a.audio);
 if(a.bystander){st('Speaking to people nearby...',true);await play(a.bystander);const b=await post('/api/bystander',form(o.id,await rec(6000)));st('Bystander: '+(b.text||'(no reply)'),true)}
 $('cancel').style.display='none'}
const post2=(u,j)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(j)}).then(r=>r.json());
$('cancel').onclick=()=>{post2('/api/cancel',{id:cur});st('Cancelled (false alarm logged)')};
$('sim').onclick=()=>{if(!stream)return alert('Press Start first');fire({speed_kmh:40,peak_g:4.5,source:'phone_sim'})};
$('bike').onclick=async()=>{if(!stream)return alert('Press Start first');const o=await post('/api/sim');cur=o.id;st('Bike telemetry replay...',true);
 await play(o.audio);const a=await post('/api/answer',form(o.id,await rec(6000)));st(a.status,a.status==='escalated');await play(a.audio)};
$('ask').onclick=async()=>{if(!stream)return alert('Press Start first');st('Listening... ask about petrol, tyre, service, oil, battery');const o=await post('/api/ask',form('x',await rec(5000)));st('You: '+(o.text||'(nothing)')+' | Buddy: '+o.reply);await play(o.audio)};
$('pre').onclick=async()=>{const o=await post('/api/precheck');st(o.reply,o.warnings>0);await play(o.audio)};
$('lowtyre').onclick=()=>{post2('/api/bike/set',{tyre_front:19});st('Front tyre set to 19 PSI. Now press Pre-ride check.')};
</script>
